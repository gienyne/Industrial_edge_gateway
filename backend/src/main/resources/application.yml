spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gateway}
    username: ${DB_USER:gateway}
    password: ${DB_PASSWORD:gateway}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true


gateway:
 mqtt:
  broker-address: tcp://localhost:1883
 sparkplug:
  group-id: SFM
  edge-node-id: IndustrialEdgeGateway
  sync-window-seconds: 15
